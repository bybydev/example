name: BYOKchat
options:
  bundleIdPrefix: com.hoangbkit
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  BYOKchatProviderCore:
    path: .
  AppFoundation:
    url: https://github.com/hoangbkit/AppFoundation
    exactVersion: 1.2.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  Highlighter:
    url: https://github.com/smittytone/HighlighterSwift
    exactVersion: 3.0.3
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    exactVersion: 2.0.0
  BeautifulMermaid:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    exactVersion: 1.0.4

targets:
  BYOKchat:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BYOKchat
    info:
      path: BYOKchat/Resources/Info.plist
      properties:
        CFBundleDisplayName: BYOKchat
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.byokchat
        PRODUCT_NAME: BYOKchat
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/BYOKchat.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore
      - package: AppFoundation
        product: AppFoundation
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlighter
        product: Highlighter
      - package: LaTeXSwiftUI
        product: LaTeXSwiftUI
      - package: BeautifulMermaid
        product: BeautifulMermaid

  BYOKchatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/BYOKchatProviderCoreTests
      - path: Tests/BYOKchatAppTests
    settings:
      base:
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BYOKchat
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore
