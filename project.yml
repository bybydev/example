name: Inkribe

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  localPackagesGroup: Packages

configs:
  Debug: debug
  Release: release

packages:
  MacAppFoundation:
    url: https://github.com/hoangbkit/MacAppFoundation.git
    exactVersion: 1.0.0
  SwiftLog:
    url: https://github.com/apple/swift-log
    exactVersion: 1.11.0
  InkribeCore:
    path: Packages/InkribeCore
  InkribeAudio:
    path: Packages/InkribeAudio
  InkribeTranscription:
    path: Packages/InkribeTranscription
  InkribeAI:
    path: Packages/InkribeAI
  InkribePersistence:
    path: Packages/InkribePersistence
  InkribeExport:
    path: Packages/InkribeExport
  InkribeModelAssets:
    path: Packages/InkribeModelAssets
  WhisperRuntime:
    path: Packages/WhisperRuntime
  LLMRuntime:
    path: Packages/LLMRuntime

fileGroups:
  - README.md
  - Makefile
  - project.yml
  - docs
  - scripts
  - testfixtures

settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    DEVELOPMENT_TEAM: J458WW3452
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: 6.0

settingGroups:
  InkribeApp:
    base:
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      CODE_SIGN_ENTITLEMENTS: InkribeMac/Resources/Inkribe.entitlements
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      DEAD_CODE_STRIPPING: YES
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
      ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      ENABLE_PREVIEWS: YES
      ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
      ENABLE_USER_SELECTED_FILES: readwrite
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Inkribe
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Inkribe uses the microphone to record audio that you choose to transcribe locally on this Mac."
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Inkribe
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    configs:
      Debug:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.debug
      Release:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe

  InkribeTest:
    base:
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      SWIFT_STRICT_CONCURRENCY: complete

targets:
  Inkribe:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMac
      - path: Models
        type: folder
        buildPhase: resources
        optional: true
    settings:
      groups:
        - InkribeApp
    dependencies:
      - package: MacAppFoundation
        product: MacAppFoundation
      - package: SwiftLog
        product: Logging
      - package: InkribeCore
        product: InkribeCore
      - package: InkribeAudio
        product: InkribeAudio
      - package: InkribeTranscription
        product: InkribeTranscription
      - package: InkribeAI
        product: InkribeAI
      - package: InkribePersistence
        product: InkribePersistence
      - package: InkribeExport
        product: InkribeExport
      - package: InkribeModelAssets
        product: InkribeModelAssets
      - package: WhisperRuntime
        product: WhisperRuntime
      - package: LLMRuntime
        product: LLMRuntime

  InkribeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMacTests
    settings:
      groups:
        - InkribeTest
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.tests
    dependencies:
      - target: Inkribe
      - package: InkribeCore
        product: InkribeCore
      - package: InkribeTranscription
        product: InkribeTranscription
      - package: InkribeAI
        product: InkribeAI

schemes:
  Inkribe:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Inkribe: all
        InkribeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: InkribeMac/Resources/Inkribe.storekit
    test:
      config: Debug
      targets:
        - name: InkribeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
