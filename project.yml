name: Inkribe

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  localPackagesGroup: Packages

configs:
  Debug: debug
  Release: release

# Keep only dependencies used by the current iOS build.
packages:
  InkribeCore:
    path: Packages/InkribeCore
  JobQueue:
    url: https://github.com/hoangbkit/JobQueue.git
    exactVersion: 1.0.0
  AppFoundation:
    url: https://github.com/hoangbkit/AppFoundation.git
    exactVersion: 1.6.4
  InkribeModelAssets:
    path: Packages/InkribeModelAssets
  WhisperRuntime:
    path: Packages/WhisperRuntime

fileGroups:
  - README.md
  - Makefile
  - project.yml
  - docs
  - scripts
  - testfixtures

settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    DEVELOPMENT_TEAM: J458WW3452
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: 6.0

settingGroups:
  InkribeMacApp:
    base:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
      CODE_SIGN_ENTITLEMENTS: InkribeMac/Resources/Inkribe.entitlements
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      DEAD_CODE_STRIPPING: YES
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
      ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
      ENABLE_PREVIEWS: YES
      ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
      ENABLE_USER_SELECTED_FILES: readwrite
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Inkribe
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Inkribe uses the microphone to record audio that you choose to transcribe locally on this Mac."
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Inkribe
      PRODUCT_MODULE_NAME: Inkribe
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    configs:
      Debug:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.debug
      Release:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe

  InkribeApp:
    base:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Inkribe/Resources/Inkribe.entitlements
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Inkribe
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Inkribe
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Inkribe adds finished videos to Photos only when you choose Save to Photos."
      SWIFT_STRICT_CONCURRENCY: complete
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1"
    configs:
      Debug:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe
      Release:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe

  InkribeMacTest:
    base:
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      SWIFT_STRICT_CONCURRENCY: complete

targets:
  InkribeMac:
    type: application
    platform: macOS
    productName: Inkribe
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMac
      - path: Models
        type: folder
        buildPhase: resources
        optional: true
    settings:
      groups:
        - InkribeMacApp
    # Mac dependency wiring is intentionally removed; only iOS is built.
    dependencies: []

  Inkribe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Inkribe
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      - path: Inkribe/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: InkribeMac/AppIcon.icon
        buildPhase: resources
      # Optional iOS weights are added by project-ios-bundled.yml. Mac Models
      # membership is independent and stays unchanged.
    settings:
      groups:
        - InkribeApp
    dependencies:
      - package: InkribeCore
        product: InkribeCore
      - package: AppFoundation
        product: AppFoundation
      - package: WhisperRuntime
        product: WhisperRuntime
      - package: InkribeModelAssets
        product: InkribeModelAssets
      - package: JobQueue
        product: JobQueue

  InkribeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMacTests
    settings:
      groups:
        - InkribeMacTest
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.tests
    # Mac dependency wiring is intentionally removed; only iOS is built.
    dependencies: []

schemes:
  InkribeMac:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        InkribeMac: all
        InkribeMacTests: [test]
    run:
      config: Debug
      storeKitConfiguration: InkribeMac/Resources/Inkribe.storekit
    test:
      config: Debug
      targets:
        - name: InkribeMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true

  Inkribe:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Inkribe: all
    run:
      config: Debug
      storeKitConfiguration: Inkribe/Resources/Inkribe.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
