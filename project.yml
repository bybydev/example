name: Inkribe

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  localPackagesGroup: Packages

configs:
  Debug: debug
  Release: release

packages:
  JobQueue:
    url: https://github.com/hoangbkit/JobQueue.git
    exactVersion: 1.0.0
  AppFoundation:
    url: https://github.com/hoangbkit/AppFoundation.git
    exactVersion: 0.1.8
  MacAppFoundation:
    url: https://github.com/hoangbkit/MacAppFoundation.git
    exactVersion: 1.0.0
  SwiftLog:
    url: https://github.com/apple/swift-log
    exactVersion: 1.11.0
  InkribeCore:
    path: Packages/InkribeCore
  InkribeAudio:
    path: Packages/InkribeAudio
  InkribeTranscription:
    path: Packages/InkribeTranscription
  InkribeAI:
    path: Packages/InkribeAI
  InkribePersistence:
    path: Packages/InkribePersistence
  InkribeExport:
    path: Packages/InkribeExport
  InkribeModelAssets:
    path: Packages/InkribeModelAssets
  WhisperRuntime:
    path: Packages/WhisperRuntime
  DiarizationRuntime:
    path: Packages/DiarizationRuntime
  LLMRuntime:
    path: Packages/LLMRuntime

fileGroups:
  - README.md
  - Makefile
  - project.yml
  - docs
  - scripts
  - testfixtures

settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    DEVELOPMENT_TEAM: J458WW3452
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_VERSION: 6.0

settingGroups:
  InkribeMacApp:
    base:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
      CODE_SIGN_ENTITLEMENTS: InkribeMac/Resources/Inkribe.entitlements
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      DEAD_CODE_STRIPPING: YES
      ENABLE_APP_SANDBOX: YES
      ENABLE_HARDENED_RUNTIME: YES
      ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
      ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
      ENABLE_PREVIEWS: YES
      ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
      ENABLE_USER_SELECTED_FILES: readwrite
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Inkribe
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "Inkribe uses the microphone to record audio that you choose to transcribe locally on this Mac."
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Inkribe
      PRODUCT_MODULE_NAME: Inkribe
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    configs:
      Debug:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.debug
      Release:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe

  InkribeIOSApp:
    base:
      CODE_SIGN_ENTITLEMENTS: InkribeIOS/Resources/Inkribe.entitlements
      CODE_SIGN_STYLE: Automatic
      CURRENT_PROJECT_VERSION: 1
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Inkribe
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Inkribe
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      SWIFT_STRICT_CONCURRENCY: complete
      SUPPORTS_MACCATALYST: NO
      TARGETED_DEVICE_FAMILY: "1,2"
    configs:
      Debug:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.ios.debug
      Release:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.ios

  InkribeMacTest:
    base:
      CODE_SIGN_STYLE: Automatic
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      SWIFT_STRICT_CONCURRENCY: complete

targets:
  InkribeMac:
    type: application
    platform: macOS
    productName: Inkribe
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMac
      - path: Models
        type: folder
        buildPhase: resources
        optional: true
    settings:
      groups:
        - InkribeMacApp
    dependencies:
      - package: MacAppFoundation
        product: MacAppFoundation
      - package: SwiftLog
        product: Logging
      - package: InkribeCore
        product: InkribeCore
      - package: InkribeAudio
        product: InkribeAudio
      - package: InkribeTranscription
        product: InkribeTranscription
      - package: InkribeAI
        product: InkribeAI
      - package: InkribePersistence
        product: InkribePersistence
      - package: InkribeExport
        product: InkribeExport
      - package: InkribeModelAssets
        product: InkribeModelAssets
      - package: WhisperRuntime
        product: WhisperRuntime
      - package: DiarizationRuntime
        product: DiarizationRuntime
      - package: LLMRuntime
        product: LLMRuntime

  Inkribe:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: InkribeIOS
      # Speech model only; never copy the entire Mac Models directory to iOS.
      - path: Models/whisper/ggml-small.bin
        buildPhase: resources
        optional: true
    settings:
      groups:
        - InkribeIOSApp
    dependencies:
      - package: AppFoundation
        product: AppFoundation
      - package: WhisperRuntime
        product: WhisperRuntime
      - package: InkribeModelAssets
        product: InkribeModelAssets
      - package: JobQueue
        product: JobQueue

  InkribeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: InkribeMacTests
    settings:
      groups:
        - InkribeMacTest
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.inkribe.tests
    dependencies:
      - target: InkribeMac
      - package: InkribeCore
        product: InkribeCore
      - package: InkribeTranscription
        product: InkribeTranscription
      - package: InkribeAI
        product: InkribeAI
      - package: LLMRuntime
        product: LLMRuntime

schemes:
  InkribeMac:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        InkribeMac: all
        InkribeMacTests: [test]
    run:
      config: Debug
      storeKitConfiguration: InkribeMac/Resources/Inkribe.storekit
    test:
      config: Debug
      targets:
        - name: InkribeMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true

  Inkribe:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        Inkribe: all
    run:
      config: Debug
      storeKitConfiguration: InkribeIOS/Resources/Inkribe.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
