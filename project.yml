name: BYOKchat
options:
  bundleIdPrefix: com.hoangbkit
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  BYOKchatProviderCore:
    path: .
  AppFoundation:
    url: https://github.com/hoangbkit/AppFoundation
    exactVersion: 1.4.0
  MacAppFoundation:
    url: https://github.com/hoangbkit/MacAppFoundation
    exactVersion: 1.4.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  Highlighter:
    url: https://github.com/smittytone/HighlighterSwift
    exactVersion: 3.0.3
  LaTeXSwiftUI:
    url: https://github.com/colinc86/LaTeXSwiftUI
    exactVersion: 2.0.0
  BeautifulMermaid:
    url: https://github.com/lukilabs/beautiful-mermaid-swift
    exactVersion: 1.0.4

targets:
  BYOKchat:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BYOKchat
    info:
      path: BYOKchat/Resources/Info.plist
      properties:
        CFBundleDisplayName: BYOKchat
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: BYOKchat uses your local network to connect to AI providers you configure on nearby devices.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: BrandBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.byokchat
        PRODUCT_NAME: BYOKchat
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore
      - package: AppFoundation
        product: AppFoundation
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlighter
        product: Highlighter
      - package: LaTeXSwiftUI
        product: LaTeXSwiftUI
      - package: BeautifulMermaid
        product: BeautifulMermaid

  BYOKmac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BYOKmac
      - path: BYOKchat/Resources/AppIcon.icon
        buildPhase: resources
    info:
      path: BYOKmac/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.byokchat
        PRODUCT_NAME: BYOKchat
        PRODUCT_MODULE_NAME: BYOKmac
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        MARKETING_VERSION: 0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
        DEAD_CODE_STRIPPING: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_BLUETOOTH: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CAMERA: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PRINTING: NO
        ENABLE_RESOURCE_ACCESS_USB: NO
    dependencies:
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore
      - package: MacAppFoundation
        product: MacAppFoundation
      - package: MarkdownUI
        product: MarkdownUI
      - package: Highlighter
        product: Highlighter
      - package: LaTeXSwiftUI
        product: LaTeXSwiftUI
      - package: BeautifulMermaid
        product: BeautifulMermaid

  BYOKchatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/BYOKchatProviderCoreTests
      - path: Tests/BYOKchatAppTests
    settings:
      base:
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BYOKchat
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore

  BYOKmacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/BYOKmacTests
    settings:
      base:
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BYOKmac
      - package: BYOKchatProviderCore
        product: BYOKchatProviderCore

  BYOKchatUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: BYOKchatUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.byokchat.uitests
        DEVELOPMENT_TEAM: J458WW3452
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BYOKchat

schemes:
  BYOKchat:
    build:
      targets:
        BYOKchat: all
        BYOKchatTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: BYOKchatTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 0

  BYOKmac:
    build:
      targets:
        BYOKmac: all
        BYOKmacTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: BYOKmacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
    management:
      shared: true
      orderHint: 1

  BYOKchatScreenshots:
    build:
      targets:
        BYOKchat:
          - run
          - test
          - archive
        BYOKchatUITests:
          - test
    test:
      config: Debug
      targets:
        - name: BYOKchatUITests
    management:
      shared: true
      orderHint: 2