name: ReadAloud

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"

configs:
  Debug: debug
  Release: release

packages:
  AppFoundation:
    url: https://github.com/hoangbkit/AppFoundation.git
    exactVersion: 1.6.4
  EpubKit:
    url: https://github.com/hoangbkit/EpubKit.git
    exactVersion: 1.1.0
  PDFKitAudio:
    url: https://github.com/hoangbkit/PDFKitAudio.git
    exactVersion: 1.1.0
  TextExtractor:
    url: https://github.com/hoangbkit/TextExtractor.git
    exactVersion: 1.1.0
  KokoroCoreML:
    url: https://github.com/hoangbkit/KokoroCoreML.git
    exactVersion: 1.1.0
  JobQueue:
    url: https://github.com/hoangbkit/JobQueue.git
    exactVersion: 1.0.0

fileGroups:
  - README.md
  - AGENTS.md
  - PLAN.md
  - Config
  - AppStore
  - docs
  - scripts
  - testfixtures

settings:
  base:
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: J458WW3452
    ENABLE_PREVIEWS: YES
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ReadAloud:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ReadAloud
      - path: .build-resources/Kokoro
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Stage Kokoro Resources
        script: |
          bash "$SRCROOT/scripts/stage-kokoro-resources-for-build.sh"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: AppFoundation
        product: AppFoundation
      - package: EpubKit
        product: EpubKit
      - package: PDFKitAudio
        product: PDFKitAudio
      - package: TextExtractor
        product: TextExtractor
      - package: KokoroCoreML
        product: KokoroTTS
      - package: JobQueue
        product: JobQueue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoangbkit.readaloud
        PRODUCT_NAME: ReadAloud
        PRODUCT_MODULE_NAME: ReadAloud
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ReadAloud/Resources/Info.plist
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

schemes:
  ReadAloud:
    build:
      parallelizeBuild: true
      buildImplicitDependencies: true
      targets:
        ReadAloud: all
    run:
      config: Debug
      storeKitConfiguration: Config/ReadAloud.storekit
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
    management:
      shared: true
