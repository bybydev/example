name: Validate iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download offline ONNX assets
        run: python3 scripts/onnx-assets.py download
      - name: Stage bundled resources
        run: bash scripts/stage-onnx-resources-for-build.sh
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Select iOS simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          simulator_id="$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          choices = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      choices.append((runtime, device["udid"]))
          choices.sort(reverse=True)
          if not choices:
              raise SystemExit("No available iOS simulator")
          print(choices[0][1])
          PY
          )"
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
      - name: Run PDF reading regression tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project ReadAloud.xcodeproj \
            -scheme ReadAloud \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            test
