name: Release

# Manually build the selected branch, always including offline ONNX resources.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: write

concurrency:
  group: readaloud-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build iOS ${{ inputs.configuration }} · bundled ONNX INT8
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Show selection and toolchain
        run: |
          set -euo pipefail
          echo "Ref: ${{ github.ref }}"
          echo "Configuration: ${{ inputs.configuration }}"
          echo "Commit: $(git rev-parse HEAD)"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache pinned ONNX resources
        uses: actions/cache@v4
        with:
          path: Resources/ONNX
          key: readaloud-onnx-v1-${{ hashFiles('scripts/onnx-assets.json', 'scripts/onnx-assets.py') }}

      - name: Download missing ONNX assets on build runner
        run: python3 scripts/onnx-assets.py download

      - name: Validate and stage offline ONNX assets
        run: bash scripts/stage-onnx-resources-for-build.sh

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache Swift package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ReadAloud-SourcePackages
          key: readaloud-source-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}

      - name: Set build release tag
        id: release
        run: |
          set -euo pipefail
          tag="mycli-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Archive unsigned iOS app
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES="$RUNNER_TEMP/ReadAloud-SourcePackages"
          IOS_DERIVED="$RUNNER_TEMP/ReadAloud-iOS-$BUILD_CONFIGURATION"
          IOS_ARCHIVE="$RUNNER_TEMP/ReadAloud-$BUILD_CONFIGURATION.xcarchive"
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS"

          xcodebuild \
            -project ReadAloud.xcodeproj \
            -scheme ReadAloud \
            -configuration "$BUILD_CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$IOS_DERIVED" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -archivePath "$IOS_ARCHIVE" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

          test -d "$IOS_ARCHIVE"
          APPLICATIONS="$IOS_ARCHIVE/Products/Applications"
          IOS_APP_COUNT="$(find "$APPLICATIONS" -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')"
          if [[ "$IOS_APP_COUNT" != 1 ]]; then
            echo "error: expected exactly one archived app, found $IOS_APP_COUNT" >&2
            exit 1
          fi
          IOS_APP="$(find "$APPLICATIONS" -maxdepth 1 -type d -name '*.app' -print)"
          IOS_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$IOS_APP/Info.plist")"
          if [[ "$IOS_BUNDLE_ID" != "com.hoangbkit.readaloud" ]]; then
            echo "error: unexpected bundle identifier: $IOS_BUNDLE_ID" >&2
            exit 1
          fi

          # Verify the actual archived app, not just the build workspace.
          python3 scripts/onnx-assets.py verify --root "$IOS_APP/ONNX"
          test -f "$IOS_APP/ONNX/ONNXAssetManifest.json"
          if find "$IOS_APP" -name '*.mlmodelc' -o -name '*.mlpackage' | grep -q .; then
            echo "error: unexpected Core ML model packaged in ONNX-only archive" >&2
            exit 1
          fi

          lower="$(echo "$BUILD_CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          ARTIFACT="$ARTIFACTS/ReadAloud-iOS-$lower-unsigned-$RELEASE_TAG.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent "$IOS_ARCHIVE" "$ARTIFACT"
          echo "Artifact: $ARTIFACT"
          rm -rf "$IOS_DERIVED" "$IOS_ARCHIVE"

      - name: Verify release archive
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          lower="$(echo "$BUILD_CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
          asset="artifacts/ReadAloud-iOS-$lower-unsigned-$RELEASE_TAG.xcarchive.zip"
          test -f "$asset"
          ls -lh "$asset"
          bytes="$(stat -f%z "$asset")"
          if (( bytes >= 2147483648 )); then
            echo "error: archive exceeds GitHub Release's 2 GB asset limit" >&2
            exit 1
          fi

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/*.xcarchive.zip \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG · $BUILD_CONFIGURATION · ONNX INT8 bundled" \
            --prerelease \
            --notes "ReadAloud iOS unsigned mycli artifact.

          Configuration: $BUILD_CONFIGURATION
          Speech backend: ONNX Runtime CPU INT8 only
          Offline assets: Kokoro INT8, Misaki G2P ONNX + lexicon, 28 English voices
          Asset download required on device: No
          Source ref: ${{ github.ref }}
          Source commit: $RELEASE_SHA"
