name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: macOS
        type: choice
        options:
          - macOS
          - iOS
          - both
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Debug
          - Release
          - both

permissions:
  contents: write

concurrency:
  group: mycli-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Authenticate private GitHub repositories (if configured)
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPO_TOKEN" ]]; then
            echo "PRIVATE_REPO_TOKEN is not configured; skipping private repository authentication."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Show selection and toolchain
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          echo "Platform: $BUILD_PLATFORM"
          echo "Configuration: $BUILD_CONFIGURATION"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/BYOKchat-SourcePackages
          key: byokchat-source-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'Package.swift') }}
          restore-keys: |
            byokchat-source-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Set build release tag
        id: release
        shell: bash
        run: |
          tag="mycli-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Build release: $tag"

      - name: Archive unsigned iOS app
        if: ${{ inputs.platform == 'iOS' || inputs.platform == 'both' }}
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES="$RUNNER_TEMP/BYOKchat-SourcePackages"
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS"

          case "$BUILD_CONFIGURATION" in
            Debug) configurations=(Debug) ;;
            Release) configurations=(Release) ;;
            both) configurations=(Debug Release) ;;
            *) echo "error: unsupported configuration $BUILD_CONFIGURATION" >&2; exit 1 ;;
          esac

          for CONFIGURATION in "${configurations[@]}"; do
            IOS_DERIVED="$RUNNER_TEMP/BYOKchat-iOS-$CONFIGURATION"
            IOS_ARCHIVE="$RUNNER_TEMP/BYOKchat-$CONFIGURATION.xcarchive"

            xcodebuild \
              -project BYOKchat.xcodeproj \
              -scheme BYOKchat \
              -configuration "$CONFIGURATION" \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$IOS_DERIVED" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              -archivePath "$IOS_ARCHIVE" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              archive

            test -d "$IOS_ARCHIVE"
            IOS_APP_COUNT="$(find "$IOS_ARCHIVE/Products/Applications" -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')"
            if [[ "$IOS_APP_COUNT" != "1" ]]; then
              echo "error: expected exactly one iOS app in $CONFIGURATION archive, found $IOS_APP_COUNT" >&2
              exit 1
            fi

            CONFIGURATION_LOWER="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
            ditto -c -k --sequesterRsrc --keepParent \
              "$IOS_ARCHIVE" \
              "$ARTIFACTS/BYOKchat-iOS-$CONFIGURATION_LOWER-unsigned-${{ steps.release.outputs.tag }}.xcarchive.zip"

            rm -rf "$IOS_DERIVED" "$IOS_ARCHIVE"
          done

      - name: Build unsigned universal macOS app
        if: ${{ inputs.platform == 'macOS' || inputs.platform == 'both' }}
        env:
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PACKAGES="$RUNNER_TEMP/BYOKchat-SourcePackages"
          ARTIFACTS="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACTS"

          case "$BUILD_CONFIGURATION" in
            Debug) configurations=(Debug) ;;
            Release) configurations=(Release) ;;
            both) configurations=(Debug Release) ;;
            *) echo "error: unsupported configuration $BUILD_CONFIGURATION" >&2; exit 1 ;;
          esac

          for CONFIGURATION in "${configurations[@]}"; do
            MAC_DERIVED="$RUNNER_TEMP/BYOKchat-macOS-$CONFIGURATION"

            xcodebuild \
              -project BYOKchat.xcodeproj \
              -scheme BYOKmac \
              -configuration "$CONFIGURATION" \
              -sdk macosx \
              -destination "platform=macOS" \
              -derivedDataPath "$MAC_DERIVED" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              build

            MAC_PRODUCTS="$MAC_DERIVED/Build/Products/$CONFIGURATION"
            MAC_APP_COUNT="$(find "$MAC_PRODUCTS" -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d ' ')"
            if [[ "$MAC_APP_COUNT" != "1" ]]; then
              echo "error: expected exactly one macOS app for $CONFIGURATION, found $MAC_APP_COUNT" >&2
              exit 1
            fi
            MAC_APP="$(find "$MAC_PRODUCTS" -maxdepth 1 -type d -name '*.app' -print)"

            MAC_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$MAC_APP/Contents/Info.plist")"
            MAC_ARCHS="$(lipo -archs "$MAC_APP/Contents/MacOS/$MAC_EXECUTABLE")"
            echo "$CONFIGURATION macOS architectures: $MAC_ARCHS"
            [[ " $MAC_ARCHS " == *" arm64 "* ]] || { echo "error: arm64 slice missing" >&2; exit 1; }
            [[ " $MAC_ARCHS " == *" x86_64 "* ]] || { echo "error: x86_64 slice missing" >&2; exit 1; }

            ICON_FOUND=false
            if find "$MAC_APP/Contents/Resources" -maxdepth 1 -type f -name '*.icns' -print -quit | grep -q .; then
              ICON_FOUND=true
            fi

            ASSETS_CAR="$MAC_APP/Contents/Resources/Assets.car"
            if [[ -f "$ASSETS_CAR" ]]; then
              ASSET_INFO="$RUNNER_TEMP/BYOKchat-macOS-$CONFIGURATION-assets.json"
              xcrun assetutil --info "$ASSETS_CAR" > "$ASSET_INFO"
              if grep -Fq 'AppIcon' "$ASSET_INFO"; then
                ICON_FOUND=true
              fi
            fi

            if [[ "$ICON_FOUND" != "true" ]]; then
              echo "error: compiled macOS app icon output was not found for $CONFIGURATION" >&2
              exit 1
            fi

            CONFIGURATION_LOWER="$(echo "$CONFIGURATION" | tr '[:upper:]' '[:lower:]')"
            ditto -c -k --sequesterRsrc --keepParent \
              "$MAC_APP" \
              "$ARTIFACTS/BYOKchat-macOS-universal-$CONFIGURATION_LOWER-unsigned-${{ steps.release.outputs.tag }}.zip"

            rm -rf "$MAC_DERIVED"
          done

      - name: Package generated Xcode project
        shell: bash
        run: |
          set -euo pipefail

          # Package after all selected builds to retain any SwiftPM resolution
          # that xcodebuild records in the generated project workspace.
          project="BYOKchat.xcodeproj"
          test -s "$project/project.pbxproj"

          artifact="artifacts/BYOKchat-xcodeproj-${{ steps.release.outputs.tag }}.zip"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$project" "$artifact"
          test -s "$artifact"
          unzip -Z1 "$artifact" | grep -Fxq "BYOKchat.xcodeproj/project.pbxproj"
          echo "Packaged generated Xcode project: $artifact"

      - name: Verify release archives
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh artifacts

          # The generated project is always published, for either platform.
          project_archive="artifacts/BYOKchat-xcodeproj-${{ steps.release.outputs.tag }}.zip"
          test -s "$project_archive"
          unzip -Z1 "$project_archive" | grep -Fxq "BYOKchat.xcodeproj/project.pbxproj"

          case "$BUILD_CONFIGURATION" in
            Debug) configurations=(debug) ;;
            Release) configurations=(release) ;;
            both) configurations=(debug release) ;;
            *) echo "error: unsupported configuration $BUILD_CONFIGURATION" >&2; exit 1 ;;
          esac

          case "$BUILD_PLATFORM" in
            iOS|macOS|both) ;;
            *) echo "error: unsupported platform $BUILD_PLATFORM" >&2; exit 1 ;;
          esac

          for configuration in "${configurations[@]}"; do
            if [[ "$BUILD_PLATFORM" == "iOS" || "$BUILD_PLATFORM" == "both" ]]; then
              test -f "artifacts/BYOKchat-iOS-$configuration-unsigned-${{ steps.release.outputs.tag }}.xcarchive.zip"
            fi
            if [[ "$BUILD_PLATFORM" == "macOS" || "$BUILD_PLATFORM" == "both" ]]; then
              test -f "artifacts/BYOKchat-macOS-universal-$configuration-unsigned-${{ steps.release.outputs.tag }}.zip"
            fi
          done

          for archive in artifacts/*.zip; do
            bytes="$(stat -f%z "$archive")"
            if (( bytes >= 2147483648 )); then
              echo "error: $archive is too large for a GitHub Release asset" >&2
              exit 1
            fi
          done

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" artifacts/*.zip \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --prerelease \
            --generate-notes
