name: Fast CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        required: true
        type: choice
        default: iOS
        options:
          - iOS
          - macOS
          - Both

permissions:
  contents: read

concurrency:
  group: byokchat-fast-ci-${{ github.repository }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast validation
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Authenticate private GitHub repositories (if configured)
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_REPO_TOKEN" ]]; then
            echo "PRIVATE_REPO_TOKEN is not configured; skipping private repository authentication."
            exit 0
          fi
          git config --global \
            url."https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - name: Show toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          swift --version

      - name: Run package tests
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift package sources
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/BYOKchat-SourcePackages
          key: byokchat-source-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'Package.swift') }}
          restore-keys: |
            byokchat-source-packages-${{ runner.os }}-${{ runner.arch }}-

      - name: Select iPhone simulator for active SDK
        if: inputs.platform == 'iOS' || inputs.platform == 'Both'
        id: simulator
        shell: bash
        run: |
          SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          RUNTIME_ID="$(
            xcrun simctl list runtimes -j | python3 -c 'import json, sys; sdk = sys.argv[1]; data = json.load(sys.stdin); print(next((runtime["identifier"] for runtime in data.get("runtimes", []) if runtime.get("isAvailable", True) and runtime.get("version") == sdk), ""))' "$SDK_VERSION"
          )"
          if [[ -z "$RUNTIME_ID" ]]; then
            echo "error: no available simulator runtime matches iOS SDK $SDK_VERSION" >&2
            xcrun simctl list runtimes
            exit 1
          fi

          SIMULATOR_UDID="$(
            xcrun simctl list devices available -j | python3 -c 'import json, sys; runtime = sys.argv[1]; data = json.load(sys.stdin); print(next((device["udid"] for device in data.get("devices", {}).get(runtime, []) if device.get("isAvailable") and device.get("name", "").startswith("iPhone")), ""))' "$RUNTIME_ID"
          )"
          if [[ -z "$SIMULATOR_UDID" ]]; then
            echo "error: no available iPhone simulator found for $RUNTIME_ID" >&2
            xcrun simctl list devices available
            exit 1
          fi

          echo "sdk_version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "runtime_id=$RUNTIME_ID" >> "$GITHUB_OUTPUT"
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          echo "Using iOS SDK $SDK_VERSION with simulator $SIMULATOR_UDID"

      - name: Run iOS unit tests on simulator
        if: inputs.platform == 'iOS' || inputs.platform == 'Both'
        shell: bash
        run: |
          SOURCE_PACKAGES="$RUNNER_TEMP/BYOKchat-SourcePackages"
          xcodebuild test \
            -project BYOKchat.xcodeproj \
            -scheme BYOKchat \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/BYOKchat-fast-iOS" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -only-testing:BYOKchatTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Run macOS unit tests
        if: inputs.platform == 'macOS' || inputs.platform == 'Both'
        shell: bash
        run: |
          SOURCE_PACKAGES="$RUNNER_TEMP/BYOKchat-SourcePackages"
          xcodebuild test \
            -project BYOKchat.xcodeproj \
            -scheme BYOKmac \
            -configuration Debug \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/BYOKchat-fast-macOS" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
